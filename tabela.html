<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela Geral — Impulso Web</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="main" id="mainContent">
    <div class="page-content" id="pageContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/database.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
let filter = 'all', search = '', page = 1, sort = { col: 'dataCadastro', dir: -1 };
const PER_PAGE = 12;

document.addEventListener('DOMContentLoaded', async () => {
  await injectLayout('Tabela Geral', 'Visão completa de todos os clientes');
  await renderPage();
});

async function renderPage() {
  const pc = document.getElementById('pageContent');
  pc.innerHTML = `
    <div class="page-header">
      <div class="breadcrumb"><span>Home</span><span>Tabela Geral</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div><h2>📋 Tabela Geral</h2><p>Visualize e filtre todos os clientes</p></div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-secondary btn-sm" onclick="exportarCSV()">📥 Exportar CSV</button>
          <a href="/cadastro-cliente.html" class="btn btn-primary btn-sm">➕ Novo</a>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:12px">
        <div class="table-toolbar" style="flex:1;margin-bottom:0">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Buscar por nome, email, serviço..." oninput="onSearch(this.value)" value="${search}">
          </div>
          <select onchange="onFilter(this.value)" style="background:var(--black3);border:1px solid var(--border2);border-radius:var(--radius2);padding:8px 12px;color:var(--text);font-family:var(--font-body)">
            <option value="all" ${filter==='all'?'selected':''}>Todos os Status</option>
            <option value="lead" ${filter==='lead'?'selected':''}>🟡 Lead</option>
            <option value="cliente" ${filter==='cliente'?'selected':''}>🔵 Cliente</option>
            <option value="aguardando" ${filter==='aguardando'?'selected':''}>🟠 Aguardando</option>
            <option value="fechado" ${filter==='fechado'?'selected':''}>🟢 Fechado</option>
            <option value="desistente" ${filter==='desistente'?'selected':''}>🔴 Desistente</option>
          </select>
        </div>
        <span id="countInfo" style="font-size:12px;color:var(--text3)"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('nome')" style="cursor:pointer">Nome ${sort.col==='nome'?sort.dir>0?'↑':'↓':''}</th>
              <th>Telefone</th>
              <th onclick="sortBy('email')" style="cursor:pointer">Email</th>
              <th>Empresa</th>
              <th onclick="sortBy('servico')" style="cursor:pointer">Serviço</th>
              <th onclick="sortBy('valor')" style="cursor:pointer">Valor ${sort.col==='valor'?sort.dir>0?'↑':'↓':''}</th>
              <th onclick="sortBy('status')" style="cursor:pointer">Status</th>
              <th>Prioridade</th>
              <th onclick="sortBy('dataCadastro')" style="cursor:pointer">Cadastro ${sort.col==='dataCadastro'?sort.dir>0?'↑':'↓':''}</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="paginationEl" style="padding:12px 20px"></div>
    </div>`;
  await renderTable();
}

async function renderTable() {
  let clientes = await DB.getClientes();
  if (filter !== 'all') clientes = clientes.filter(c => c.status === filter);
  if (search) {
    const q = search.toLowerCase();
    clientes = clientes.filter(c =>
      [c.nome,c.email,c.empresa,c.servico,c.telefone].some(f => (f||'').toLowerCase().includes(q))
    );
  }
  clientes.sort((a,b) => {
    let va = a[sort.col]||'', vb = b[sort.col]||'';
    if (sort.col === 'valor') { va = Number(va); vb = Number(vb); }
    if (va < vb) return -sort.dir;
    if (va > vb) return sort.dir;
    return 0;
  });

  const total = clientes.length;
  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (page > totalPages) page = totalPages;
  const paged = clientes.slice((page-1)*PER_PAGE, page*PER_PAGE);

  document.getElementById('countInfo').textContent = `${total} clientes encontrados`;

  const tbody = document.getElementById('tableBody');
  if (!paged.length) {
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:48px;color:var(--text3)"><div style="font-size:2rem;margin-bottom:8px">🔍</div>Nenhum resultado</td></tr>`;
  } else {
    tbody.innerHTML = paged.map(c => {
      const st = STATUS_LABELS[c.status] || {};
      const pr = PRIORIDADE[c.prioridade] || PRIORIDADE.normal;
      return `<tr>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="user-avatar" style="width:28px;height:28px;font-size:11px">${c.nome?.[0]||'?'}</div>
            <span style="font-weight:600;color:var(--white)">${c.nome}</span>
          </div>
        </td>
        <td>
          <button class="btn btn-sm btn-whatsapp" onclick="openWhatsApp('${c.telefone}','${c.nome}')" title="Abrir WhatsApp">
            💬 ${FMT.phone(c.telefone)||'—'}
          </button>
        </td>
        <td style="color:var(--text2)">${c.email||'—'}</td>
        <td style="color:var(--text3)">${c.empresa||'—'}</td>
        <td>${c.servico||'—'}</td>
        <td style="color:var(--gold);font-weight:700">${FMT.currency(c.valor)}</td>
        <td><span class="badge ${st.cls}">${st.label||c.status}</span></td>
        <td><span class="badge ${pr.cls}">${pr.label}</span></td>
        <td style="color:var(--text3)">${FMT.date(c.dataCadastro)}</td>
        <td>
          <div style="display:flex;gap:4px">
            <a href="cadastro-cliente.html?id=${c.id}" class="btn btn-sm btn-ghost" title="Editar">✏️</a>
            <button class="btn btn-sm btn-danger" onclick="deleteCliente('${c.id}')" title="Excluir">🗑️</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  // Pagination
  const pagEl = document.getElementById('paginationEl');
  if (totalPages > 1) {
    const start = Math.max(1, page-2);
    const end = Math.min(totalPages, page+2);
    pagEl.innerHTML = `<div class="pagination">
      ${page > 1 ? `<div class="page-btn" onclick="goPage(1)">«</div><div class="page-btn" onclick="goPage(${page-1})">‹</div>` : ''}
      ${Array.from({length:end-start+1},(_,i)=>start+i).map(i=>`<div class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</div>`).join('')}
      ${page < totalPages ? `<div class="page-btn" onclick="goPage(${page+1})">›</div><div class="page-btn" onclick="goPage(${totalPages})">»</div>` : ''}
      <span style="font-size:11px;color:var(--text3);margin-left:8px">Página ${page} de ${totalPages}</span>
    </div>`;
  } else { pagEl.innerHTML = ''; }
}

async function onSearch(v) { search = v; page = 1; await renderTable(); }
async function onFilter(v) { filter = v; page = 1; await renderTable(); }
async function goPage(p) { page = p; await renderTable(); window.scrollTo(0,0); }
async function sortBy(col) {
  sort = sort.col === col ? { col, dir: -sort.dir } : { col, dir: 1 };
  await renderTable();
}
async function deleteCliente(id) {
  const c = await DB.getCliente(id);
  confirm(`Excluir o cliente <strong>${c?.nome}</strong>?`, async () => {
    await DB.deleteCliente(id);
    toast('Cliente excluído!', 'info');
    await renderTable();
  });
}
async function exportarCSV() {
  const clientes = await DB.getClientes();
  const data = clientes.map(c => ({
    Nome: c.nome, Email: c.email||'', Telefone: c.telefone||'',
    Empresa: c.empresa||'', Servico: c.servico||'', Valor: c.valor||0,
    Status: c.status, Prioridade: c.prioridade, DataCadastro: FMT.date(c.dataCadastro)
  }));
  exportCSV(data, 'clientes-impulsoweb.csv');
}
</script>
</body>
</html>
