<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impulso Web — Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-bg"></div>
  <div class="login-grid"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🚀</div>
      <h1>Impulso Web</h1>
      <p>Sistema de Gestão de Clientes & Projetos</p>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <span class="input-icon">📧</span>
          <input type="email" id="email" class="has-icon" placeholder="seu@email.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="senha" class="has-icon" placeholder="••••••••" required>
        </div>
      </div>

      <div class="login-error" id="loginError"></div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
        <span id="btnText">Entrar</span>
        <span id="btnSpinner" style="display:none">⏳</span>
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/database.js"></script>
<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
