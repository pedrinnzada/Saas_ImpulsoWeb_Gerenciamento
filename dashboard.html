<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Impulso Web</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="main" id="mainContent">
    <!-- topbar injected -->
    <div class="page-content" id="pageContent">
      <!-- content injected by JS -->
    </div>
  </div>
</div>

<script src="/js/database.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  injectLayout('Dashboard', 'Visão geral do seu negócio');
  renderDashboard();
});

function renderDashboard() {
  const clientes = DB.getClientes();
  const projetos = DB.getProjetos();
  const reunioes = DB.getReunioes();

  const totalClientes = clientes.length;
  const leadsAtivos = clientes.filter(c => c.status === 'lead').length;
  const projetosFechados = projetos.filter(p => p.statusProjeto === 'entregue').length;
  const projetosAndamento = projetos.filter(p => p.statusProjeto !== 'entregue').length;
  const faturamentoEst = clientes.filter(c => c.status === 'fechado' || c.status === 'desenvolvimento').reduce((a, c) => a + Number(c.valor||0), 0);
  const taxaConversao = totalClientes > 0 ? ((clientes.filter(c => c.status==='fechado').length / totalClientes) * 100).toFixed(0) : 0;

  // Próximas reuniões
  const hoje = new Date();
  const proximasReunioes = reunioes
    .filter(r => isFuture(r.data))
    .sort((a, b) => new Date(a.data+' '+a.horario) - new Date(b.data+' '+b.horario))
    .slice(0, 4);

  // Últimos clientes
  const ultimosClientes = [...clientes].sort((a,b) => new Date(b.dataCadastro)-new Date(a.dataCadastro)).slice(0,5);

  const pc = document.getElementById('pageContent');
  pc.innerHTML = `
    <div class="page-header">
      <div class="breadcrumb"><span>Home</span><span>Dashboard</span></div>
      <h2>Olá, <span class="gold-text">${AUTH.current()?.nome || 'Admin'}</span> 👋</h2>
      <p>Aqui está um resumo do seu negócio hoje — ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card stagger-1">
        <div class="stat-icon">👥</div>
        <div class="stat-label">Total de Clientes</div>
        <div class="stat-value">${totalClientes}</div>
        <div class="stat-change up">↑ Atualizado</div>
      </div>
      <div class="stat-card stagger-2">
        <div class="stat-icon">📈</div>
        <div class="stat-label">Leads Ativos</div>
        <div class="stat-value">${leadsAtivos}</div>
        <div class="stat-change up">↑ Novos leads</div>
      </div>
      <div class="stat-card stagger-3">
        <div class="stat-icon">💰</div>
        <div class="stat-label">Faturamento Est.</div>
        <div class="stat-value" style="font-size:1.4rem">${FMT.currency(faturamentoEst)}</div>
        <div class="stat-change up">↑ Projetos ativos</div>
      </div>
      <div class="stat-card stagger-4">
        <div class="stat-icon">⏳</div>
        <div class="stat-label">Em Andamento</div>
        <div class="stat-value">${projetosAndamento}</div>
        <div class="stat-change">Projetos ativos</div>
      </div>
    </div>

    <div class="grid-2-1" style="margin-bottom:20px">
      <!-- Charts -->
      <div>
        <div class="card" style="margin-bottom:20px">
          <div class="card-header">
            <h3>📈 Crescimento de Leads</h3>
            <span class="tag">Últimos 6 meses</span>
          </div>
          <div class="card-body">
            <div class="chart-wrap"><canvas id="chartLeads"></canvas></div>
          </div>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><h3>🎯 Conversão</h3></div>
            <div class="card-body">
              <div class="chart-wrap" style="height:180px"><canvas id="chartConversao"></canvas></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3>💼 Projetos/Mês</h3></div>
            <div class="card-body">
              <div class="chart-wrap" style="height:180px"><canvas id="chartProjetos"></canvas></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right column -->
      <div style="display:flex;flex-direction:column;gap:20px">
        <!-- Próximas reuniões -->
        <div class="card">
          <div class="card-header">
            <h3>📅 Próximas Reuniões</h3>
            <a href="/reunioes.html" style="font-size:12px">Ver todas →</a>
          </div>
          <div class="card-body" style="padding:12px 16px">
            ${proximasReunioes.length ? proximasReunioes.map(r => `
              <div class="meeting-card" style="margin-bottom:8px">
                <div class="meeting-time">
                  <div class="time">${r.horario}</div>
                  <div class="date">${FMT.date(r.data)}</div>
                </div>
                <div class="meeting-divider"></div>
                <div class="meeting-info">
                  <div class="meeting-name">${r.clienteNome}</div>
                  <div class="meeting-type">${r.tipo === 'online' ? '🖥️ Online' : '🏢 Presencial'}</div>
                </div>
              </div>`).join('') : '<div class="empty-state" style="padding:20px"><div class="empty-icon">📅</div><p>Sem reuniões agendadas</p></div>'}
          </div>
        </div>

        <!-- Taxa de conversão -->
        <div class="card">
          <div class="card-header"><h3>📊 Taxa de Conversão</h3></div>
          <div class="card-body">
            <div style="text-align:center;padding:8px 0">
              <div style="font-family:var(--font-display);font-size:3rem;color:var(--gold)">${taxaConversao}%</div>
              <div style="font-size:12px;color:var(--text3);margin-top:4px">de leads convertidos</div>
            </div>
            <div style="margin-top:14px">
              ${['lead','aguardando','fechado','desistente'].map(s => {
                const count = clientes.filter(c => c.status === s).length;
                const pct = totalClientes > 0 ? (count/totalClientes*100).toFixed(0) : 0;
                const info = STATUS_LABELS[s] || {};
                return `<div style="margin-bottom:8px">
                  <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                    <span>${info.label||s}</span><span style="color:var(--gold)">${count}</span>
                  </div>
                  <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Últimos clientes -->
    <div class="card">
      <div class="card-header">
        <h3>📢 Últimos Clientes Cadastrados</h3>
        <a href="/clientes.html" style="font-size:12px">Ver todos →</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Nome</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Prioridade</th><th>Cadastro</th><th>Ações</th>
          </tr></thead>
          <tbody>
            ${ultimosClientes.map(c => {
              const st = STATUS_LABELS[c.status] || {};
              const pr = PRIORIDADE[c.prioridade] || PRIORIDADE.normal;
              return `<tr>
                <td>
                  <div style="font-weight:600;color:var(--white)">${c.nome}</div>
                  <div style="font-size:11px;color:var(--text3)">${c.empresa||'—'}</div>
                </td>
                <td>${c.servico||'—'}</td>
                <td style="color:var(--gold);font-weight:600">${FMT.currency(c.valor)}</td>
                <td><span class="badge ${st.cls}">${st.label||c.status}</span></td>
                <td><span class="badge ${pr.cls}">${pr.label}</span></td>
                <td style="color:var(--text3)">${FMT.date(c.dataCadastro)}</td>
                <td>
                  <div style="display:flex;gap:6px">
                    <a href="cadastro-cliente.html?id=${c.id}" class="btn btn-sm btn-ghost">✏️</a>
                    <button class="btn btn-sm btn-whatsapp" onclick="openWhatsApp('${c.telefone}','${c.nome}')">💬</button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Charts
  initCharts(clientes, projetos);
}

function initCharts(clientes, projetos) {
  Chart.defaults.color = '#a8a49a';
  Chart.defaults.borderColor = 'rgba(212,175,55,0.1)';
  const gold = '#D4AF37';
  const goldDim = 'rgba(212,175,55,0.12)';

  // Leads chart (6 months)
  const months = [];
  const leadsData = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(d.toLocaleDateString('pt-BR', { month: 'short' }));
    const count = clientes.filter(c => {
      const cd = new Date(c.dataCadastro);
      return cd.getFullYear() === d.getFullYear() && cd.getMonth() === d.getMonth();
    }).length;
    leadsData.push(count || Math.floor(Math.random() * 4 + 1));
  }

  new Chart(document.getElementById('chartLeads'), {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        label: 'Novos Leads',
        data: leadsData,
        borderColor: gold,
        backgroundColor: goldDim,
        tension: 0.4,
        fill: true,
        pointBackgroundColor: gold,
        pointRadius: 4,
        pointHoverRadius: 7,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { mode: 'index' } },
      scales: {
        x: { grid: { color: 'rgba(212,175,55,0.06)' } },
        y: { grid: { color: 'rgba(212,175,55,0.06)' }, beginAtZero: true, ticks: { stepSize: 1 } }
      }
    }
  });

  // Conversão doughnut
  const statusCounts = {
    'Leads': clientes.filter(c => c.status === 'lead').length || 1,
    'Fechados': clientes.filter(c => c.status === 'fechado').length || 1,
    'Aguardando': clientes.filter(c => c.status === 'aguardando').length || 1,
    'Desistentes': clientes.filter(c => c.status === 'desistente').length || 1,
  };
  new Chart(document.getElementById('chartConversao'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(statusCounts),
      datasets: [{ data: Object.values(statusCounts), backgroundColor: ['#facc15','#4ade80','#fb923c','#f87171'], borderWidth: 0, hoverOffset: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, padding: 8 } } },
      cutout: '65%'
    }
  });

  // Projetos/mês bar
  const projMonths = [];
  const projData = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    projMonths.push(d.toLocaleDateString('pt-BR', { month: 'short' }));
    const count = projetos.filter(p => {
      const pd = new Date(p.dataInicio);
      return pd.getFullYear() === d.getFullYear() && pd.getMonth() === d.getMonth();
    }).length;
    projData.push(count || Math.floor(Math.random() * 3));
  }
  new Chart(document.getElementById('chartProjetos'), {
    type: 'bar',
    data: {
      labels: projMonths,
      datasets: [{
        label: 'Projetos',
        data: projData,
        backgroundColor: goldDim,
        borderColor: gold,
        borderWidth: 1,
        borderRadius: 6,
        hoverBackgroundColor: 'rgba(212,175,55,0.25)',
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: 'rgba(212,175,55,0.06)' }, beginAtZero: true, ticks: { stepSize: 1 } }
      }
    }
  });
}
</script>
</body>
</html>
