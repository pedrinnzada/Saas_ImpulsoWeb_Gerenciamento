<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes — Impulso Web</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="main" id="mainContent">
    <div class="page-content" id="pageContent"></div>
  </div>
</div>

<!-- Status Modal -->
<div class="modal-overlay" id="statusModal">
  <div class="modal" style="max-width:360px">
    <div class="modal-header">
      <h3>Atualizar Status</h3>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:16px;font-size:13px">Cliente: <strong id="statusClienteName" style="color:var(--white)"></strong></p>
      <div style="display:flex;flex-direction:column;gap:8px" id="statusOptions"></div>
    </div>
  </div>
</div>

<!-- View Client Modal -->
<div class="modal-overlay" id="viewModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3>👤 Detalhes do Cliente</h3>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body" id="viewModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('viewModal')">Fechar</button>
      <button class="btn btn-primary" id="viewEditBtn">✏️ Editar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/database.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
let currentFilter = 'all';
let searchTerm = '';
let currentPage = 1;
const PER_PAGE = 9;

document.addEventListener('DOMContentLoaded', async () => {
  await injectLayout('Clientes', 'Gerencie sua base de clientes');
  await renderPage();
});

async function renderPage() {
  const pc = document.getElementById('pageContent');
  pc.innerHTML = `
    <div class="page-header">
      <div class="breadcrumb"><span>Home</span><span>Clientes</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div>
          <h2>👥 Clientes</h2>
          <p>Gerencie todos os seus clientes e leads</p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="exportarCSV()">📥 Exportar CSV</button>
          <a href="/cadastro-cliente.html" class="btn btn-primary">➕ Novo Cliente</a>
        </div>
      </div>
    </div>

    <div class="table-toolbar">
      <div class="search-wrap" style="max-width:320px">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar cliente..." oninput="onSearch(this.value)">
      </div>
      <div class="filter-bar" id="filterBar">
        ${[
          ['all','🌐 Todos'],['lead','🟡 Leads'],['cliente','🔵 Clientes'],
          ['aguardando','🟠 Aguardando'],['fechado','🟢 Fechados'],['desistente','🔴 Desistentes']
        ].map(([v,l]) => `<div class="filter-chip ${currentFilter===v?'active':''}" onclick="setFilter('${v}')">${l}</div>`).join('')}
      </div>
    </div>

    <div id="clientsContainer"></div>
    <div id="paginationContainer"></div>
  `;
  await renderClients();
}

async function renderClients() {
  let clientes = await DB.getClientes();
  if (currentFilter !== 'all') clientes = clientes.filter(c => c.status === currentFilter);
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    clientes = clientes.filter(c =>
      c.nome?.toLowerCase().includes(q) ||
      c.email?.toLowerCase().includes(q) ||
      c.empresa?.toLowerCase().includes(q) ||
      c.servico?.toLowerCase().includes(q)
    );
  }
  // sort by priority then date
  clientes.sort((a,b) => {
    const po = {alta:0,normal:1,baixa:2};
    const prioA = po[a.prioridade] ?? 1;
    const prioB = po[b.prioridade] ?? 1;
    if (prioA !== prioB) return prioA - prioB;
    return new Date(b.dataCadastro) - new Date(a.dataCadastro);
  });

  const total = clientes.length;
  const totalPages = Math.ceil(total / PER_PAGE);
  const paged = clientes.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);

  const container = document.getElementById('clientsContainer');
  if (!paged.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">👥</div><p>Nenhum cliente encontrado</p><a href="/cadastro-cliente.html" class="btn btn-primary" style="margin-top:16px">➕ Cadastrar Primeiro Cliente</a></div>`;
  } else {
    container.innerHTML = `<div class="clients-grid">${paged.map(clientCard).join('')}</div>`;
  }

  // Pagination
  const pagEl = document.getElementById('paginationContainer');
  if (totalPages > 1) {
    pagEl.innerHTML = `<div class="pagination">
      ${currentPage > 1 ? `<div class="page-btn" onclick="goPage(${currentPage-1})">‹</div>` : ''}
      ${Array.from({length:totalPages},(_,i)=>`<div class="page-btn ${i+1===currentPage?'active':''}" onclick="goPage(${i+1})">${i+1}</div>`).join('')}
      ${currentPage < totalPages ? `<div class="page-btn" onclick="goPage(${currentPage+1})">›</div>` : ''}
    </div>`;
  } else { pagEl.innerHTML = ''; }
}

function clientCard(c) {
  const st = STATUS_LABELS[c.status] || {};
  const pr = PRIORIDADE[c.prioridade] || PRIORIDADE.normal;
  return `
  <div class="client-card" id="card-${c.id}">
    <div class="client-card-header">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="client-avatar">${c.nome?.[0]||'?'}</div>
        <div>
          <div class="client-name">${c.nome}</div>
          <div class="client-company">${c.empresa||'—'}</div>
        </div>
      </div>
      <span class="badge ${pr.cls}" style="font-size:10px">${pr.label}</span>
    </div>

    <div class="client-meta">
      <div class="client-meta-item">📧 <span>${c.email||'—'}</span></div>
      <div class="client-meta-item">📱 <span>${FMT.phone(c.telefone)||'—'}</span></div>
      <div class="client-meta-item">💼 <span>${c.servico||'—'}</span></div>
      <div class="client-meta-item">💰 <span style="color:var(--gold);font-weight:600">${FMT.currency(c.valor)}</span></div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span class="badge ${st.cls}">${st.label||c.status}</span>
      <span style="font-size:11px;color:var(--text3)">${FMT.date(c.dataCadastro)}</span>
    </div>

    <div class="client-actions">
      <button class="btn btn-sm btn-ghost" style="flex:1" onclick="viewClient('${c.id}')">👁️ Ver</button>
      <a href="cadastro-cliente.html?id=${c.id}" class="btn btn-sm btn-ghost">✏️</a>
      <button class="btn btn-sm btn-whatsapp" onclick="openWhatsApp('${c.telefone}','${c.nome}')">💬</button>
      <button class="btn btn-sm btn-ghost" onclick="openStatusModal('${c.id}')">🔄</button>
      <button class="btn btn-sm btn-danger" onclick="deleteCliente('${c.id}')">🗑️</button>
    </div>
  </div>`;
}

async function setFilter(f) {
  currentFilter = f;
  currentPage = 1;
  await renderPage();
}
async function onSearch(v) {
  searchTerm = v;
  currentPage = 1;
  await renderClients();
}
async function goPage(p) {
  currentPage = p;
  await renderClients();
  window.scrollTo(0, 0);
}

async function viewClient(id) {
  const c = await DB.getCliente(id);
  if (!c) return;
  const st = STATUS_LABELS[c.status] || {};
  const pr = PRIORIDADE[c.prioridade] || PRIORIDADE.normal;
  document.getElementById('viewModalBody').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div>
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
          <div class="client-avatar" style="width:56px;height:56px;font-size:22px;border-radius:14px">${c.nome?.[0]||'?'}</div>
          <div>
            <div style="font-family:var(--font-display);font-size:1.25rem;color:var(--white)">${c.nome}</div>
            <div style="font-size:12px;color:var(--text3)">${c.empresa||'Sem empresa'}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:20px">
          <span class="badge ${st.cls}">${st.label}</span>
          <span class="badge ${pr.cls}">${pr.label}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${[
            ['📧 Email', c.email],
            ['📱 Telefone', FMT.phone(c.telefone)],
            ['🏢 Empresa', c.empresa||'—'],
            ['👤 Idade', c.idade ? c.idade + ' anos' : '—'],
            ['📅 Cadastro', FMT.date(c.dataCadastro)],
          ].map(([l,v])=>`<div style="display:flex;gap:10px;font-size:13px"><span style="color:var(--text3);min-width:100px">${l}</span><span style="color:var(--white)">${v||'—'}</span></div>`).join('')}
        </div>
      </div>
      <div>
        <div style="background:var(--black3);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;margin-bottom:16px">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Proposta</div>
          <div style="font-size:13px;color:var(--text);margin-bottom:6px">💼 ${c.servico||'—'}</div>
          <div style="font-family:var(--font-display);font-size:1.8rem;color:var(--gold)">${FMT.currency(c.valor)}</div>
        </div>
        ${c.obs ? `<div style="background:var(--black3);border:1px solid var(--border);border-radius:var(--radius2);padding:16px">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Observações</div>
          <p style="font-size:13px;color:var(--text);line-height:1.6">${c.obs}</p>
        </div>` : ''}
      </div>
    </div>`;
  document.getElementById('viewEditBtn').onclick = () => window.location.href = `/cadastro-cliente.html?id=${c.id}`;
  openModal('viewModal');
}

async function openStatusModal(id) {
  const c = await DB.getCliente(id);
  if (!c) return;
  document.getElementById('statusClienteName').textContent = c.nome;
  const statuses = [
    ['lead', '🟡 Lead'],
    ['cliente', '🔵 Cliente'],
    ['aguardando', '🟠 Aguardando resposta'],
    ['fechado', '🟢 Fechado (Contratou)'],
    ['desistente', '🔴 Desistente'],
  ];
  document.getElementById('statusOptions').innerHTML = statuses.map(([v,l]) => `
    <button class="btn ${c.status===v?'btn-primary':'btn-secondary'} btn-full" onclick="updateStatus('${id}','${v}')">
      ${l} ${c.status===v?'✓':''}
    </button>`).join('');
  openModal('statusModal');
}

async function updateStatus(id, status) {
  await DB.updateCliente(id, { status });
  closeModal('statusModal');
  if (status === 'fechado') {
    const c = await DB.getCliente(id);
    await DB.addNotif(`${c.nome} marcado como Fechado! 🎉`, 'success');
    toast(`${c.nome} marcado como Fechado! 🎉 Agora você pode criar um projeto.`, 'success');
  } else {
    toast('Status atualizado!', 'success');
  }
  await renderClients();
}

async function deleteCliente(id) {
  const c = await DB.getCliente(id);
  if (!c) return;
  confirm(`Excluir o cliente <strong>${c.nome}</strong>? Esta ação não pode ser desfeita.`, async () => {
    await DB.deleteCliente(id);
    toast('Cliente excluído!', 'info');
    await renderClients();
  });
}

async function exportarCSV() {
  const clientes = await DB.getClientes();
  const data = clientes.map(c => ({
    Nome: c.nome, Email: c.email||'', Telefone: c.telefone||'',
    Empresa: c.empresa||'', Servico: c.servico||'', Valor: c.valor||0,
    Status: c.status, Prioridade: c.prioridade, Observacoes: c.obs||'',
    DataCadastro: FMT.date(c.dataCadastro)
  }));
  exportCSV(data, 'clientes-impulsoweb.csv');
}
</script>
</body>
</html>
